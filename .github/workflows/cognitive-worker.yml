# Acorn Cognitive Worker — bounded continuous cognition.
# Observe -> discover -> dispatch -> measure -> Cortex -> identity/usage -> economic reconciliation.
# Synaptic memory persists routing outcomes through workflow artifacts, never source.
# Economic evidence records identity, measured usage, pricing state and billing boundary.
# Fluidity is a runtime property: work must flow, never silent-stop.
# Prior fluidity hint is loaded and consumed by the conductor; measurement verifies it.
# Never writes source, never merges, never claims LIVE, never auto-charges.
name: cognitive-worker
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [feat/autopilot-real-cycle]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write
  models: read
concurrency:
  group: cognitive-worker-${{ github.event.pull_request.number || github.ref_name || 'scheduled' }}
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore prior fluidity hint
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          FLUIDITY_PRIOR: cognitive-fluidity-prior.json
        run: |
          node --input-type=module <<'EOF'
          import { writeFileSync } from 'node:fs';
          import { loadPriorFluidity } from './scripts/cognitive-fluidity.mjs';
          const prior = loadPriorFluidity();
          if (!prior) { console.log('prior_fluidity=none'); process.exit(0); }
          writeFileSync('cognitive-fluidity-prior.json', `${JSON.stringify(prior, null, 2)}\n`);
          console.log(`prior_fluidity=${prior.state || 'unknown'} mode=${prior.mode || 'unknown'} hint_consumed_next=true`);
          EOF
      - name: Initialize cognitive fluidity timing
        run: |
          rm -f cognitive-fluidity-timing.json cognitive-fluidity.json
          FLUIDITY_STAGE=setup FLUIDITY_PHASE=start node scripts/cognitive-fluidity-timer.mjs
      - name: Global breaker gate
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
        run: node .github/swarm/system-breaker.mjs
      - name: Execute integrated cognitive worker cycle
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REF: ${{ github.event.pull_request.head.ref || github.ref }}
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          FAIL_ON_DISPATCH_ERROR: 'false'
          WORKER_EVIDENCE: worker-evidence.json
          SYNAPTIC_MEMORY: synaptic-memory.json
          COGNITIVE_MEMORY_INDEX: cognitive-memory-index.json
          MEASURED_RANKING: measured-intelligence-ranking.json
          MEASUREMENT_FEEDBACK: measurement-feedback.json
          MEASUREMENT_RECORD: measurement-record.json
          FLUIDITY_TIMING: cognitive-fluidity-timing.json
        run: |
          FLUIDITY_STAGE=worker FLUIDITY_PHASE=start node scripts/cognitive-fluidity-timer.mjs
          set +e
          node scripts/cognitive-worker.mjs
          status=$?
          FLUIDITY_STAGE=worker FLUIDITY_PHASE=stop node scripts/cognitive-fluidity-timer.mjs
          exit $status
      - name: Run independent cognitive stages concurrently
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REF: ${{ github.event.pull_request.head.ref || github.ref }}
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          FAIL_ON_DISPATCH_ERROR: 'false'
          WORKER_EVIDENCE: worker-evidence.json
          USAGE_COMMERCE: identity-usage-commerce.json
          FLUIDITY_TIMING: cognitive-fluidity-timing.json
          FLUIDITY_PRIOR: cognitive-fluidity-prior.json
        run: node scripts/cognitive-conductor.mjs
      - name: Reconcile the complete economic network state
        env:
          USAGE_COMMERCE: identity-usage-commerce.json
          CONNECTION_EVIDENCE: connection-evidence.json
          ECONOMIC_PRICING: schema/economic-pricing.v0.json
          ECONOMIC_SNAPSHOT: economic-network-snapshot.json
          FLUIDITY_TIMING: cognitive-fluidity-timing.json
        run: |
          FLUIDITY_STAGE=economic FLUIDITY_PHASE=start node scripts/cognitive-fluidity-timer.mjs
          set +e
          node scripts/economic-cycle.mjs
          status=$?
          FLUIDITY_STAGE=economic FLUIDITY_PHASE=stop node scripts/cognitive-fluidity-timer.mjs
          exit $status
      - name: Measure cognitive fluidity and close the feedback loop
        env:
          FLUIDITY_TIMING: cognitive-fluidity-timing.json
          FLUIDITY_OUTPUT: cognitive-fluidity.json
          WORKER_EVIDENCE: worker-evidence.json
          FLUIDITY_PRIOR: cognitive-fluidity-prior.json
          RUNTIME_DIAGNOSIS: runtime-diagnosis.json
        run: node scripts/cognitive-fluidity.mjs
      - name: Preserve cycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-worker-cycle-${{ github.run_id }}
          path: worker-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Cortex evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acorn-cortex-cycle-${{ github.run_id }}
          path: |
            cortex-evidence.json
            cortex-evolution-memory.json
            cortex-genome.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve identity usage commerce evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-usage-commerce-${{ github.run_id }}
          path: identity-usage-commerce.json
          if-no-files-found: warn
          retention-days: 365
      - name: Preserve economic network evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acorn-economic-network-${{ github.run_id }}
          path: economic-network-snapshot.json
          if-no-files-found: warn
          retention-days: 365
      - name: Preserve cognitive fluidity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acorn-cognitive-fluidity-${{ github.run_id }}
          path: |
            cognitive-fluidity.json
            cognitive-fluidity-timing.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve synaptic memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-synaptic-memory
          path: synaptic-memory.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve cognitive memory index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-memory-index
          path: cognitive-memory-index.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve measured intelligence ranking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-intelligence-ranking
          path: measured-intelligence-ranking.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve measurement feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-feedback
          path: measurement-feedback.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve dated measurement record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-record
          path: measurement-record.json
          if-no-files-found: warn
          retention-days: 90
      - name: Record bounded result
        if: always()
        run: |
          echo "cognitive-worker + parallel Cortex/usage + economic-network + fluidity cycle completed."
          echo "DEFINED != EXECUTED != VERIFIED != LIVE."
          echo "fluidity = runtime property FLOWING|FRICTION|STALLED|HOLD_HUMAN; silent skip is STALLED."
          echo "economic evidence = identity + connection + verified usage + explicit pricing state."
          echo "no hidden tracking; no identity guessing; no automatic charge; payment remains a human/billing boundary."
          echo "GitHub Models requires explicit models: read permission; GH_TOKEN is never an OpenRouter credential."
          echo "auto_merge=false; live=false; human authority=carl"
