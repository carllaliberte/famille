# Acorn Cognitive Worker — bounded continuous cognition.
# Observe -> discover -> dispatch -> measure through existing swarm/collaboration workflows.
# Never writes source, never merges, never claims LIVE.
name: cognitive-worker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: cognitive-worker
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Observe and discover
        id: observe
        env:
          DISCOVER_TRIGGER: worker
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          node scripts/discover-cycle.mjs | tee worker-cycle.json
          echo "idle=$(node -e 'const x=require("./worker-cycle.json"); console.log(String(x.idle))')" >> "$GITHUB_OUTPUT"

      - name: Dispatch all open fronts
        if: steps.observe.outputs.idle == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 20 \
            --json number,headRefOid,isDraft \
            --jq '.[] | [.number,.headRefOid,.isDraft] | @tsv' > open-prs.tsv

          dispatched=0
          while IFS=$'\t' read -r number sha draft; do
            [ -n "${number:-}" ] || continue
            [ -n "${sha:-}" ] || continue
            echo "worker: dispatch swarm PR #${number} sha=${sha} draft=${draft}"
            gh workflow run swarm.yml --ref main -f "ref=${sha}"
            dispatched=$((dispatched + 1))
          done < open-prs.tsv

          echo "worker: dispatched=${dispatched}"

      - name: Record bounded result
        if: always()
        run: |
          echo "cognitive-worker.v1 — observe/discover/dispatch cycle completed."
          echo "DEFINED != EXECUTED != VERIFIED != LIVE."
          echo "auto_merge=false; live=false; human authority=carl"
