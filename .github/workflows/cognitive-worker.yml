# Acorn Cognitive Worker — bounded continuous cognition.
# Observe -> discover -> dispatch -> measure through existing swarm/collaboration workflows.
# Synaptic memory persists routing outcomes through workflow artifacts, never source.
# Unified memory index joins measured routing/collaboration/execution evidence without authority.
# A dated measurement record links the cycle state and is read back before prior evidence is reused.
# Cortex records the same real cycle; it never invents execution or authority.
# Identity/usage commerce records only identified, executed, verified usage; it never invents a customer or charge.
# Never writes source, never merges, never claims LIVE.
name: cognitive-worker
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [feat/autopilot-real-cycle]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: cognitive-worker-${{ github.event.pull_request.number || github.ref_name || 'scheduled' }}
  cancel-in-progress: false
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Global breaker gate
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
        run: node .github/swarm/system-breaker.mjs
      - name: Execute integrated cognitive worker cycle
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_REF: ${{ github.event.pull_request.head.ref || github.ref }}
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          FAIL_ON_DISPATCH_ERROR: 'false'
          WORKER_EVIDENCE: worker-evidence.json
          SYNAPTIC_MEMORY: synaptic-memory.json
          COGNITIVE_MEMORY_INDEX: cognitive-memory-index.json
          MEASURED_RANKING: measured-intelligence-ranking.json
          MEASUREMENT_FEEDBACK: measurement-feedback.json
          MEASUREMENT_RECORD: measurement-record.json
        run: node scripts/cognitive-worker.mjs
      - name: Run Cortex over the measured worker cycle
        run: node scripts/cortex-runtime.mjs
      - name: Measure identified usage for commercial review
        env:
          WORKER_EVIDENCE: worker-evidence.json
          USAGE_COMMERCE: identity-usage-commerce.json
        run: node scripts/usage-commerce-cycle.mjs
      - name: Preserve cycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-worker-cycle-${{ github.run_id }}
          path: worker-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Cortex evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acorn-cortex-cycle-${{ github.run_id }}
          path: cortex-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve identity usage commerce evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-usage-commerce-${{ github.run_id }}
          path: identity-usage-commerce.json
          if-no-files-found: warn
          retention-days: 365
      - name: Preserve synaptic memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-synaptic-memory
          path: synaptic-memory.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve cognitive memory index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-memory-index
          path: cognitive-memory-index.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve measured intelligence ranking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measured-intelligence-ranking
          path: measured-intelligence-ranking.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve measurement feedback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-feedback
          path: measurement-feedback.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve dated measurement record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measurement-record
          path: measurement-record.json
          if-no-files-found: warn
          retention-days: 90
      - name: Record bounded result
        if: always()
        run: |
          echo "cognitive-worker.v14 + cortex-runtime.v0 + identity-usage-commerce.v1 cycle completed."
          echo "DEFINED != EXECUTED != VERIFIED != LIVE."
          echo "commercial evidence = identified + executed + verified usage only."
          echo "no identity guessing; no automatic charge; human/billing system remains the charging boundary."
          echo "auto_merge=false; live=false; human authority=carl"
