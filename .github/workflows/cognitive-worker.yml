# Acorn Cognitive Worker — bounded continuous cognition.
# Observe -> discover -> dispatch -> measure through existing swarm/collaboration workflows.
# Never writes source, never merges, never claims LIVE.
name: cognitive-worker

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: cognitive-worker
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Observe and discover
        env:
          DISCOVER_TRIGGER: worker
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -eu
          node scripts/discover-cycle.mjs | tee worker-cycle.json

      - name: Discover open work fronts
        id: fronts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 20 \
            --json number,headRefOid,isDraft,updatedAt \
            --jq '.[] | [.number,.headRefOid,.isDraft,.updatedAt] | @tsv' > open-prs.tsv
          count=$(grep -c . open-prs.tsv || true)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "worker: open work fronts=${count}"
          cat open-prs.tsv

      - name: Dispatch swarm on every discovered front
        if: steps.fronts.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          dispatched=0
          while IFS=$'\t' read -r number sha draft updated; do
            [ -n "${number:-}" ] || continue
            [ -n "${sha:-}" ] || continue
            echo "worker: dispatch swarm PR #${number} sha=${sha} draft=${draft} updated=${updated}"
            gh workflow run swarm.yml --ref main -f "ref=${sha}"
            dispatched=$((dispatched + 1))
          done < open-prs.tsv
          echo "worker: dispatched=${dispatched}"

      - name: Preserve cycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-worker-cycle-${{ github.run_id }}
          path: |
            worker-cycle.json
            open-prs.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Record bounded result
        if: always()
        run: |
          echo "cognitive-worker.v1 — observe/discover/dispatch/measure cycle completed."
          echo "DEFINED != EXECUTED != VERIFIED != LIVE."
          echo "auto_merge=false; live=false; human authority=carl"
