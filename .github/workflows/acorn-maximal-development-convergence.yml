name: ACORN Maximal Development Convergence
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/acorn-maximal-development-convergence.mjs"
      - "scripts/acorn-grand-chore-conductor.mjs"
      - "test/acorn-maximal-development-convergence.test.js"
      - ".github/workflows/acorn-maximal-development-convergence.yml"
permissions:
  contents: read
jobs:
  constitution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/acorn-maximal-development-convergence.test.js
      - run: node --input-type=module -e "import('./scripts/acorn-maximal-development-convergence.mjs').then(({assertDevelopmentConstitution})=>assertDevelopmentConstitution())"
