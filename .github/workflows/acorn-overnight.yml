name: acorn-overnight
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Bounded run duration in minutes (1-360)"
        required: true
        default: "325"
        type: number
permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read
concurrency:
  group: acorn-overnight
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate bounded duration
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          node -e "const m=Number(process.env.MINUTES); if(!Number.isInteger(m)||m<1||m>360) { console.error('minutes must be an integer from 1 to 360'); process.exit(1); } console.log('bounded_minutes='+m)"

  slot1:
    needs: validate
    if: ${{ inputs.minutes >= 1 }}
    uses: ./.github/workflows/acorn-overnight-slot.yml
    with:
      slot: "1"
      slot_minutes: ${{ inputs.minutes <= 60 && inputs.minutes || 60 }}
  slot2:
    needs: slot1
    if: ${{ inputs.minutes > 60 }}
    uses: ./.github/workflows/acorn-overnight-slot.yml
    with:
      slot: "2"
      slot_minutes: ${{ inputs.minutes - 60 <= 60 && inputs.minutes - 60 || 60 }}
  slot3:
    needs: slot2
    if: ${{ inputs.minutes > 120 }}
    uses: ./.github/workflows/acorn-overnight-slot.yml
    with:
      slot: "3"
      slot_minutes: ${{ inputs.minutes - 120 <= 60 && inputs.minutes - 120 || 60 }}
  slot4:
    needs: slot3
    if: ${{ inputs.minutes > 180 }}
    uses: ./.github/workflows/acorn-overnight-slot.yml
    with:
      slot: "4"
      slot_minutes: ${{ inputs.minutes - 180 <= 60 && inputs.minutes - 180 || 60 }}
  slot5:
    needs: slot4
    if: ${{ inputs.minutes > 240 }}
    uses: ./.github/workflows/acorn-overnight-slot.yml
    with:
      slot: "5"
      slot_minutes: ${{ inputs.minutes - 240 <= 60 && inputs.minutes - 240 || 60 }}
  slot6:
    needs: slot5
    if: ${{ inputs.minutes > 300 }}
    uses: ./.github/workflows/acorn-overnight-slot.yml
    with:
      slot: "6"
      slot_minutes: ${{ inputs.minutes - 300 }}
