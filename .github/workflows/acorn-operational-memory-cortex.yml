name: ACORN Operational Memory Cortex
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/acorn-operational-memory-cortex.mjs"
      - "test/acorn-operational-memory-cortex.test.js"
      - "docs/acorn-operational-memory-cortex.md"
      - ".github/workflows/acorn-operational-memory-cortex.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/acorn-operational-memory-cortex.test.js
      - run: node -e "import('./scripts/acorn-operational-memory-cortex.mjs').then(m=>{const e=m.recordEpisode({actor:'a',goal:'g',evidence:['e']}); const l=m.extractLessons({episode:e,lessons:['l']})[0]; const v=m.validateLesson(l,{evidence:['e']}); if(m.assertOperationalMemoryConstitution(v)!==true) process.exit(1);})"
