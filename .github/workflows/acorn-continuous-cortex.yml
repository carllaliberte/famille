name: ACORN Continuous Cortex
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '*/15 * * * *'
jobs:
  cortex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/acorn-continuous-cortex-conductor.test.js
      - run: node -e "import('./scripts/acorn-continuous-cortex-conductor.mjs').then(m=>m.assertContinuousCortexConstitution({breaker_touched:false,authority_transfer:false,auto_merge:false,auto_spend:false,auto_signature:false}))"
