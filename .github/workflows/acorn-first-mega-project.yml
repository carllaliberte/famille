name: ACORN First Mega Project
on:
  workflow_dispatch:
  schedule:
    - cron: "13,43 * * * *"
permissions:
  contents: read
jobs:
  self-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test test/acorn-first-mega-project.test.js
      - run: node --input-type=module -e "import('./scripts/acorn-first-mega-project.mjs').then(({assertSelfProjectConstitution})=>console.log('ACORN_SELF_PROJECT',assertSelfProjectConstitution()))"
