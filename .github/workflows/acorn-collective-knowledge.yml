name: ACORN Collective Knowledge
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/acorn-collective-knowledge-fluidity.mjs"
      - "test/acorn-collective-knowledge-fluidity.test.js"
      - "docs/acorn-collective-knowledge-fluidity.md"
      - ".github/workflows/acorn-collective-knowledge.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/acorn-collective-knowledge-fluidity.test.js
      - run: node -e "import('./scripts/acorn-collective-knowledge-fluidity.mjs').then(m=>{const k=m.createKnowledge({subject:'x',claim:'c',evidence:['e']}); const v=m.verifyKnowledge(k); if(m.assertCollectiveKnowledgeConstitution(v)!==true) process.exit(1);})"
