name: connector-flux-verify
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run connector flux contract
        run: node --test test/acorn-connector-flux.test.js
      - name: Honest local proof loop
        run: node scripts/acorn-connector-flux.mjs
