name: ACORN Parabolic Development
on:
  workflow_dispatch:
  push:
    paths: ["scripts/acorn-parabolic-growth-engine.mjs","scripts/acorn-parabolic-development-conductor.mjs","scripts/acorn-universal-project-multiplier.mjs","scripts/acorn-network-effect-fabric.mjs","test/acorn-parabolic-growth.test.js"]
permissions: {contents: read}
jobs:
  parabolic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --test test/acorn-parabolic-growth.test.js