name: ACORN Monetization Operating System
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - scripts/acorn-monetization-operating-system.mjs
      - test/acorn-monetization-operating-system.test.js
jobs:
  monetization:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --test test/acorn-monetization-operating-system.test.js
      - run: node --input-type=module -e "import('./scripts/acorn-monetization-operating-system.mjs').then(({assertMonetizationConstitution})=>assertMonetizationConstitution())"
      - run: node scripts/acorn-monetization-smoke.mjs