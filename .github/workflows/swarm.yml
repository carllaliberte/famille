# Complementary AI review. Not a judge. Does not replace npm test (carte.yml).
# Continuous: pull_request opened/synchronize/reopened + issue_comment /swarm.
# Manual: workflow_dispatch (ref input, default main).
# Missing secrets skip (fail-closed, exit 0). Never merge. Never wrangler.
name: swarm
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to checkout (branch, tag, or SHA)
        required: false
        default: main
        type: string
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.action != 'labeled') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && (github.event.label.name == 'fable' || github.event.label.name == 'fabre')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login != 'github-actions[bot]' && (contains(github.event.comment.body, '/swarm') || contains(github.event.comment.body, '/sonnet') || contains(github.event.comment.body, '/fable') || contains(github.event.comment.body, '/fabre') || contains(github.event.comment.body, '/chatgpt') || contains(github.event.comment.body, '/deepseek') || contains(github.event.comment.body, '/gemini') || contains(github.event.comment.body, '/flux') || contains(github.event.comment.body, 'FLUX from:')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve ref
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.event.inputs.ref || 'main' }}" >> "$GITHUB_OUTPUT"
          else
            sha=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.sha)
            echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Global breaker gate
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
        run: node .github/swarm/system-breaker.mjs
      - name: swarm review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
          HAIKU_API_KEY: ${{ secrets.HAIKU_API_KEY }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: node .github/swarm/review.mjs
