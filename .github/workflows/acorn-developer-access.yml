name: ACORN — Developer Access Discovery

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run developer access contract tests
        run: node --test test/acorn-universal-developer-access.test.js
      - name: Emit measured catalog snapshot
        run: node -e "import('./scripts/acorn-universal-developer-access.mjs').then(({seedDeveloperCatalog,snapshotDeveloperAccess})=>console.log(JSON.stringify(snapshotDeveloperAccess({access:seedDeveloperCatalog()}),null,2)))"
