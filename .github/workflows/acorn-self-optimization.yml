name: ACORN Self Optimization
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/acorn-self-optimization.mjs"
      - "test/acorn-self-optimization.test.js"
      - "docs/acorn-self-optimization.md"
      - ".github/workflows/acorn-self-optimization.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/acorn-self-optimization.test.js
      - run: node -e "import('./scripts/acorn-self-optimization.mjs').then(m=>{const p=m.proposeOptimization({candidate:'rail'}); if(m.assertSelfOptimizationConstitution(p)!==true) process.exit(1);})"
