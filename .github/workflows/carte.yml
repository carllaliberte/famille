name: carte
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: carte-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  peut-dire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts || npm install
      - run: npm test
