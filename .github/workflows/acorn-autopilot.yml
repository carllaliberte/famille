name: acorn-autopilot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - '.github/swarm/**'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

concurrency:
  group: acorn-autopilot
  cancel-in-progress: false

env:
  ACORN_PURPOSE: 'Pas pour détruire l’humanité. Pour contribuer à en bâtir une meilleure.'
  ACORN_HUMAN_AUTHORITY: 'carl'
  ACORN_AUTO_MERGE: 'false'
  ACORN_LIVE: 'false'
  ACORN_PRODUCTION_WRITE_ALLOWED: 'false'
  ACORN_RUNTIME_MINUTES: '330'
  ACORN_RUNTIME_INTERVAL_SECONDS: '60'
  ACORN_RUNTIME_DISPATCH_EVERY: '6'

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Global Breaker control
        id: breaker
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
        run: |
          node --input-type=module <<'NODE'
          import { controlState } from './.github/swarm/system-breaker.mjs';
          import { appendFileSync } from 'node:fs';
          const state = controlState(process.env);
          const allowed = state.mode === 'RUN' && !state.diagnostic && state.breaker_closed;
          appendFileSync(process.env.GITHUB_OUTPUT, `allowed=${allowed}\nmode=${state.mode}\n`);
          console.log(JSON.stringify({
            purpose: process.env.ACORN_PURPOSE,
            mode: state.mode,
            breaker_closed: state.breaker_closed,
            diagnostic: state.diagnostic,
            allowed,
            human_authority: 'carl',
            auto_merge: false,
            production_write_allowed: false,
            live: false
          }, null, 2));
          NODE

      - name: Run autonomous cognitive runtime
        if: ${{ steps.breaker.outputs.allowed == 'true' }}
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/autonomous-runtime.mjs

      - name: Emit control evidence
        if: always()
        env:
          BREAKER_MODE: ${{ steps.breaker.outputs.mode }}
          BREAKER_ALLOWED: ${{ steps.breaker.outputs.allowed }}
        run: |
          mkdir -p evidence/autopilot
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('evidence/autopilot/control.json', JSON.stringify({
            workflow: 'acorn-autopilot',
            purpose: process.env.ACORN_PURPOSE,
            breaker_mode: process.env.BREAKER_MODE || 'UNKNOWN',
            breaker_allowed: process.env.BREAKER_ALLOWED === 'true',
            human_authority: 'carl',
            auto_merge: false,
            production_write_allowed: false,
            live: false,
            global_breaker_required: true,
            execution_claim: process.env.BREAKER_ALLOWED === 'true' ? 'RUNTIME_ALLOWED' : 'RUNTIME_BLOCKED'
          }, null, 2) + '\n');
          NODE

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acorn-autopilot-runtime-${{ github.run_id }}
          path: evidence/autopilot
          if-no-files-found: warn
          retention-days: 7

      - name: Renew autonomous runtime
        if: ${{ steps.breaker.outputs.allowed == 'true' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f evidence/autopilot/runtime/checkpoint.json ]; then
            STATE=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('evidence/autopilot/runtime/checkpoint.json','utf8')).state || 'UNKNOWN')")
          else
            STATE=UNKNOWN
          fi
          case "$STATE" in
            STOPPED_BREAKER)
              echo "Runtime renewal stopped by breaker.";
              exit 0
              ;;
            *)
              echo "Renewing autonomous runtime time slice: $STATE";
              gh workflow run acorn-autopilot.yml --ref main
              ;;
          esac
