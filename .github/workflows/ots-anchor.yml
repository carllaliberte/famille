# OpenTimestamps — stamp the merged SHA after Carl squash.
# Never on PR. Never on a working branch. Never before merge.
# No third-party secret. Public OTS calendars are anonymous.
# Identity: ots-bot (not Carl). Message: ots: anchor <sha>
# Calendars pinned here — a notary change is a PR, not a silent client update.
name: ots-anchor
on:
  push:
    branches: [main]
    paths-ignore:
      - ".ots-anchor/**"
permissions:
  contents: write
  issues: write
concurrency:
  group: ots-anchor-main
  cancel-in-progress: false
jobs:
  stamp:
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'ots:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install opentimestamps-client
        run: pip install --quiet opentimestamps-client
      - name: stamp merged SHA
        id: stamp
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .ots-anchor
          printf '%s\n' "$SHA" > .ots-anchor/latest.sha
          printf '%s\n' "$SHA" > ".ots-anchor/${SHA}.sha"
          # Pending on purpose. Upgrade job finalizes later.
          # Calendars verified HTTP 200 on 2026-09-08 (uptime.opentimestamps.org + live GET).
          ok=0
          for i in 1 2 3; do
            if ots stamp \
              -c https://alice.btc.calendar.opentimestamps.org \
              -c https://bob.btc.calendar.opentimestamps.org \
              -c https://finney.calendar.eternitywall.com \
              -c https://btc.calendar.catallaxy.com \
              ".ots-anchor/${SHA}.sha"; then
              ok=1
              break
            fi
            echo "stamp attempt ${i} failed; retry"
            sleep 15
          done
          test "$ok" -eq 1
          cp ".ots-anchor/${SHA}.sha.ots" .ots-anchor/latest.sha.ots
          ots info ".ots-anchor/${SHA}.sha.ots" || true
      - name: commit as ots-bot
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "ots-bot"
          git config user.email "ots-bot@users.noreply.github.com"
          git add .ots-anchor/latest.sha .ots-anchor/latest.sha.ots \
            ".ots-anchor/${SHA}.sha" ".ots-anchor/${SHA}.sha.ots"
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "ots: anchor ${SHA}"
          git push
      - name: alert stamp failure
        if: failure() && steps.stamp.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Stamp échoué après 3 tentatives.

          SHA manqué : \`${SHA}\`
          Run : ${RUN_URL}

          Ligne FILE.md (écart d'état, format pr-merged-file) :

          | Dépôt | Item | Fait |
          |---|---|---|
          | famille | ots-anchor | stamp échoué · SHA \`${SHA}\` · [run](${RUN_URL}) |

          ots-bot ne commit pas FILE.md (chemins : \`.ots-anchor/**\` + bloc \`ots-status\` dans \`unforge-check/OTS.md\`).
          Grok \`pr-merged-file\` aligne FILE.md si le tableau Ouvert est faux.
          EOF
          )
          NUM=$(gh issue list --state all --limit 100 --json number,title \
            --jq '.[] | select(.title=="ots-anchor-status") | .number' | head -n1 || true)
          if [ -z "${NUM}" ]; then
            gh issue create --title "ots-anchor-status" --body "$BODY"
          else
            gh issue comment "$NUM" --body "$BODY"
            gh issue reopen "$NUM" || true
          fi
