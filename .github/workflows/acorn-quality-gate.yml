name: ACORN Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Long-term quality constitution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full test suite
        run: npm test
      - name: Run Acorn quality gate
        run: node scripts/acorn-quality-gate.mjs
