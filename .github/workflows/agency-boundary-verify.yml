name: agency-boundary-verify
on:
  push:
    branches: [feat/acorn-agency-boundary]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/acorn-agency-boundary.test.js
      - run: npm test
