name: swarm-collaboration
on:
  workflow_run:
    workflows: ["swarm"]
    types: [completed]
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
jobs:
  second-pass:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Global breaker gate
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
        run: node .github/swarm/system-breaker.mjs
      - name: Measure Astra and Codex transport
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
          ASTRA_CODEX_EVIDENCE: astra-codex-evidence.json
        run: |
          set -eu
          node scripts/astra-codex-probe.mjs | tee astra-codex-probe.log
      - name: Upload Astra/Codex evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-codex-evidence
          path: |
            astra-codex-evidence.json
            astra-codex-probe.log
          if-no-files-found: error
          retention-days: 14
      - name: Measured collaboration pass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OLLAMA_HOST: ${{ secrets.OLLAMA_HOST }}
          HAIKU_API_KEY: ${{ secrets.HAIKU_API_KEY }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: node .github/swarm/collaborate.mjs
      - name: Upload collaboration memory
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-collaboration-memory
          path: collaboration-memory.json
          if-no-files-found: ignore
          retention-days: 90
