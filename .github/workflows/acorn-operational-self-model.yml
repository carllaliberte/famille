name: Acorn Operational Self Model
on:
  push:
    paths: ["scripts/acorn-operational-self-model.mjs","test/acorn-operational-self-model.test.js",".github/workflows/acorn-operational-self-model.yml"]
  pull_request:
    paths: ["scripts/acorn-operational-self-model.mjs","test/acorn-operational-self-model.test.js",".github/workflows/acorn-operational-self-model.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node --test test/acorn-operational-self-model.test.js
