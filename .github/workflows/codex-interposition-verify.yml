name: codex-interposition-verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [grok/auto-20260917-codex-interposition]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        run: |
          node --check scripts/codex-interposition-gate.mjs
          bash -n scripts/codex
      - name: Focused interposition tests
        run: node --test test/acorn-ai-interposition.test.js test/cognitive-worker-interposition.test.js test/codex-interposition-gate.test.js test/codex-worker-interposition.test.js
      - name: Full regression
        run: npm test
