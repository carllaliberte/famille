name: beyond-plasticity-verify
on:
  push:
    branches: [main, 'feat/acorn-beyond-plasticity']
    paths: ['scripts/acorn-beyond-plasticity.mjs','test/acorn-beyond-plasticity.test.js','package.json','.github/workflows/beyond-plasticity-verify.yml']
  pull_request:
    paths: ['scripts/acorn-beyond-plasticity.mjs','test/acorn-beyond-plasticity.test.js','package.json','.github/workflows/beyond-plasticity-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --check scripts/acorn-beyond-plasticity.mjs
      - run: node --test test/acorn-beyond-plasticity.test.js
      - run: node scripts/acorn-beyond-plasticity.mjs
      - run: npm test
