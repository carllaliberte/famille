name: ACORN — API Harvest v0

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Contract tests
        run: node --test test/acorn-api-harvest.test.js

      - name: Measure harvest snapshot
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HAIKU_API_KEY: ${{ secrets.HAIKU_API_KEY }}
        run: |
          mkdir -p .acorn proposals
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            import { harvestBundle } from './scripts/acorn-api-harvest.mjs';
            const roster = JSON.parse(readFileSync('schema/agents.json','utf8'));
            const agents = Array.isArray(roster) ? roster : (roster.agents || roster.roster || []);
            const bundle = harvestBundle({ env: process.env, roster: agents });
            writeFileSync('.acorn/api-harvest.json', JSON.stringify(bundle.snapshot, null, 2) + '\n');
            writeFileSync('proposals/agents-delta.json', JSON.stringify({
              contract: 'acorn.api-harvest.v0',
              purpose: 'Proposed DECLARED roster ids. Not a live mutation of schema/agents.json.',
              auto_merge: false,
              authority: false,
              live: false,
              delta: bundle.delta
            }, null, 2) + '\n');
            console.log(JSON.stringify({ proposed: bundle.delta.length, ready: bundle.snapshot.roster_ready, stall: false }, null, 2));
          "

      - name: Open PR if measured delta exists
        env:
          GH_TOKEN: ${{ github.token }}
          GROK_SIGNING_KEY: ${{ secrets.GROK_SIGNING_KEY }}
          GROK_SIGNING_KEY_PUB: ${{ secrets.GROK_SIGNING_KEY_PUB }}
          GROK_GIT_NAME: ${{ secrets.GROK_GIT_NAME }}
          GROK_GIT_EMAIL: ${{ secrets.GROK_GIT_EMAIL }}
        run: |
          set -euo pipefail
          git add .acorn/api-harvest.json proposals/agents-delta.json
          if git diff --cached --quiet; then
            echo "HOLD mesuré: pas de delta. Pas de PR."
            exit 0
          fi
          if [ -z "${GROK_SIGNING_KEY:-}" ] || [ -z "${GROK_GIT_NAME:-}" ] || [ -z "${GROK_GIT_EMAIL:-}" ]; then
            echo "HOLD mesuré: secrets de signature absents. Pas de PR."
            gh issue list --search "ACORN API harvest v0 in:title" --limit 1 --json number --jq '.[].number' | grep -q . || \
              gh issue create --title "ACORN — API harvest v0 (HOLD signature)" --body "Snapshot mesuré. Pas un merge. Carl pose les secrets de signature ou squash la branche tooling. AUTO_MERGE=FALSE." || true
            exit 0
          fi
          BRANCH="grok/acorn-api-harvest-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "$GROK_GIT_NAME"
          git config user.email "$GROK_GIT_EMAIL"
          git checkout -b "$BRANCH"
          git commit -m "harvest.v0 snapshot mesuré — proposition seulement"
          git push origin "HEAD:$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "ACORN harvest.v0 — surfaces AI developer" --body "Pas un merge. Pas main. Carl squash. Jamais fast-forward. Jamais auto-merge.

DISCOVERED != CONNECTED != LIVE.
Pas de write schema/agents.json.
OPENROUTER absent = skip mesuré.
"
