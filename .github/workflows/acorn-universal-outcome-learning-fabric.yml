name: ACORN Universal Outcome Learning Fabric
on:
  workflow_dispatch:
  push:
    paths: ["scripts/acorn-universal-outcome-learning-fabric.mjs","scripts/acorn-outcome-learning-conductor.mjs","test/acorn-universal-outcome-learning-fabric.test.js"]
permissions: {contents: read}
jobs:
  learning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --test test/acorn-universal-outcome-learning-fabric.test.js