name: identity-continuity-verify

on:
  push:
    branches: [feat/acorn-identity-continuity]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/acorn-identity-continuity.test.js
      - run: npm test
