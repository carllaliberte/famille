name: acorn-cortex-action-outcome-fabric

on:
  pull_request:
    paths:
      - "scripts/acorn-cortex-action-outcome-fabric.mjs"
      - "test/acorn-cortex-action-outcome-fabric.test.js"
      - "docs/acorn-cortex-action-outcome-fabric.md"
      - ".github/workflows/acorn-cortex-action-outcome-fabric.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
