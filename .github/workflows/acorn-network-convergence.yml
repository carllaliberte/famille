name: ACORN Network Convergence
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - scripts/acorn-network-convergence.mjs
      - test/acorn-network-convergence.test.js
      - .acorn/network-convergence.json
jobs:
  network:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/acorn-network-convergence.test.js
      - run: node --input-type=module -e "import('./scripts/acorn-network-convergence.mjs').then(({assertNetworkConvergence})=>assertNetworkConvergence({contract:'acorn.network-convergence.v1',breaker_touched:false}))"