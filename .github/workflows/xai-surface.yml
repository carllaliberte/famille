name: xai-surface

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: xai-surface
  cancel-in-progress: false

env:
  ACORN_AUTO_MERGE: 'false'
  ACORN_LIVE: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Global Breaker control
        id: breaker
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
        run: node .github/swarm/system-breaker.mjs

      - name: Measure xAI surface
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p evidence/xai
          node scripts/xai-surface-monitor.mjs > evidence/xai/surface.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const ev = JSON.parse(readFileSync('evidence/xai/surface.json', 'utf8'));
          const out = {
            workflow: 'xai-surface',
            key_present: Boolean(ev.key_present),
            configuration_error: ev.counts?.configuration_error ?? null,
            breaker_mode: process.env.ACORN_SYSTEM_MODE || null,
            live: false,
            auto_merge: false,
            authority: 'carl',
            leaked_secret: false
          };
          console.log(JSON.stringify(out, null, 2));
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xai-surface-${{ github.run_id }}
          path: evidence/xai/
          if-no-files-found: warn
          retention-days: 14
