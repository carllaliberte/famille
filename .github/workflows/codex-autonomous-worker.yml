name: codex-autonomous-worker

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Task budget for this run"
        required: false
        default: "12"
        type: string
      max_minutes:
        description: "Time budget in minutes"
        required: false
        default: "300"
        type: string
      task_number:
        description: "Optional GitHub issue number to work on"
        required: false
        default: ""
        type: string
      debug:
        description: "Immediate debug mode"
        required: false
        default: true
        type: boolean
      self_test:
        description: "Diagnostic only — no source changes, no PR"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: >-
    codex-autonomous-worker-${{
      github.event_name == 'workflow_dispatch' && 'dispatch' || 'source'
    }}
  cancel-in-progress: false

jobs:
  codex:
    if: >
      (github.event_name != 'issues' ||
       contains(join(github.event.issue.labels.*.name, ','), 'codex-task')) &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI (pinned)
        run: npm install --global @openai/codex@0.153.4

      - name: Activate OpenRouter wire budget guard
        run: |
          chmod +x scripts/codex
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          test -x scripts/codex
          node --check scripts/codex-openrouter-budget-proxy.mjs

      - name: Verify Codex CLI version
        run: |
          codex --version
          test "$(codex --version)" = "codex-cli 0.153.4"

      - name: Restore Codex authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p "$HOME/.codex"
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "OpenRouter key present; skipping ChatGPT Codex session so the OpenRouter budget guard is authoritative."
          elif [ -n "$CODEX_AUTH_JSON" ]; then
            printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
            chmod 600 "$HOME/.codex/auth.json"
            echo "ChatGPT Astra Codex session restored."
          else
            echo "No CODEX_AUTH_JSON; worker uses OPENROUTER_API_KEY if present."
          fi
          unset CODEX_AUTH_JSON OPENROUTER_API_KEY

      - name: Global breaker gate
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
        run: node .github/swarm/system-breaker.mjs

      - name: Run Codex worker
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_PROVIDER: openrouter
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          CODEX_MAX_OUTPUT_TOKENS: "1024"
          CODEX_OPENROUTER_PROXY_PORT: "17891"
          CODEX_WORKER_EVIDENCE: codex-worker-evidence.json
          CODEX_WORKER_MEMORY: evidence/codex/worker-memory.json
          CODEX_TASK_LABEL: codex-task
          CODEX_TASK_TIMEOUT_MINUTES: "20"
          CODEX_REPAIR_ATTEMPTS: "3"
          CODEX_MAX_TASKS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_tasks || '12' }}
          CODEX_MAX_RUN_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_minutes || '300' }}
          CODEX_TASK_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.task_number || '' }}
          CODEX_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug == false) && 'false' || 'true' }}
          CODEX_SELF_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.self_test && 'true' || 'false' }}
          CODEX_TRIGGER: ${{ github.event_name }}
          CODEX_HEAD_SHA: ${{ github.sha }}
          CODEX_BEFORE_SHA: ${{ github.event.before || '' }}
          CODEX_ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: node scripts/codex-autonomous-worker.mjs

      - name: Heartbeat summary
        if: always()
        run: |
          if [ -f codex-worker-evidence.json ]; then
            node -e 'const e=require("./codex-worker-evidence.json"); const h=`HEARTBEAT status=${e.status} patch_source=${e.codex?.patch_source||"none"} codex.available=${Boolean(e.codex?.available)} codex.executed=${Boolean(e.codex?.executed)} tasks=${(e.completed_tasks||[]).length} pr=${e.prs?.[0]?.url||"none"}`; console.log(h); console.log(JSON.stringify({status:e.status,codex:e.codex,human:e.human_actions_required,capabilities:e.capabilities||null,autonomy:e.trigger_gate||null},null,2));'
          else
            echo "HEARTBEAT status=FAILED reason=no-evidence-file"
          fi

      - name: Preserve Codex worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-worker-${{ github.run_id }}
          path: |
            codex-worker-evidence.json
            evidence/codex/worker-memory.json
          if-no-files-found: warn
          retention-days: 30

      - name: Continue autonomous runtime
        if: ${{ always() && vars.ACORN_SYSTEM_MODE == 'Run' && github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          STATUS=""
          if [ -f codex-worker-evidence.json ]; then
            STATUS="$(node -e 'const e=require("./codex-worker-evidence.json"); process.stdout.write(String(e.status || ""))')"
          fi
          case "$STATUS" in
            HUMAN_REQUIRED|WAIT_HUMAN_MERGE)
              echo "CONTINUITY paused for human authority: $STATUS"
              exit 0
              ;;
          esac
          echo "CONTINUITY one follow-up after source event $EVENT_NAME status=$STATUS"
          sleep 30
          gh workflow run codex-autonomous-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            -f max_tasks=12 \
            -f max_minutes=300 \
            -f debug=true \
            -f self_test=false
