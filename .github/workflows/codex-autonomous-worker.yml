name: Codex Autonomous Worker

on:
  workflow_dispatch:
    inputs:
      continue_runtime:
        description: Continue autonomous runtime after the worker
        required: false
        default: 'true'
        type: boolean
      continuation_depth:
        description: Bounded continuation depth
        required: false
        default: '0'
        type: string
      self_test:
        description: Run self-test mode
        required: false
        default: 'false'
        type: boolean
      debug:
        description: Enable debug output
        required: false
        default: 'false'
        type: boolean
  workflow_run:
    workflows: ["Acorn Autonomous Cadence"]
    types: [completed]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: write

concurrency:
  group: codex-autonomous-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codex:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Invalidate stale task skips on explicit wake
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/invalidate-stale-tasks.mjs || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI (pinned)
        run: npm install --global @openai/codex@0.31.0

      - name: Activate OpenRouter wire budget guard
        run: node scripts/openrouter-wire-guard.mjs

      - name: Verify Codex CLI version
        run: codex --version

      - name: Restore Codex authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "CODEX_AUTH_JSON missing; worker remains available for non-auth checks"
          else
            mkdir -p "$HOME/.codex"
            printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
            chmod 600 "$HOME/.codex/auth.json"
            echo "Codex authentication restored"
          fi

      - name: Global breaker gate
        run: node scripts/system-breaker.mjs check

      - name: Run Codex worker
        env:
          SELF_TEST: ${{ inputs.self_test || 'false' }}
          DEBUG: ${{ inputs.debug || 'false' }}
        run: node scripts/codex-worker.mjs

      - name: Heartbeat summary
        if: always()
        run: node scripts/heartbeat-summary.mjs

      - name: Preserve Codex worker evidence
        if: always()
        run: node scripts/preserve-worker-evidence.mjs

      - name: Continue autonomous runtime
        id: continue_runtime
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          (inputs.continue_runtime == true || inputs.continue_runtime == 'true') &&
          (inputs.continuation_depth == '' || inputs.continuation_depth == '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "continue_runtime=true"
          echo "continuation_depth=${{ inputs.continuation_depth || '0' }}"
          gh workflow run codex-autonomous-worker.yml \
            --ref "${{ github.ref_name }}" \
            -f continue_runtime=false \
            -f continuation_depth=1 \
            -f self_test=false \
            -f debug=${{ inputs.debug || 'false' }}

      - name: Continuation summary
        if: always()
        run: |
          echo "continuation_step=${{ steps.continue_runtime.outcome }}"
          echo "continuation_conclusion=${{ job.status }}"

      - name: Complete
        if: always()
        run: echo "Codex autonomous worker complete"
