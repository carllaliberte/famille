name: codex-autonomous-worker

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Task budget for this run"
        required: false
        default: "12"
        type: string
      max_minutes:
        description: "Time budget in minutes"
        required: false
        default: "300"
        type: string
      task_number:
        description: "Optional GitHub issue number to work on"
        required: false
        default: ""
        type: string
      debug:
        description: "Immediate debug mode"
        required: false
        default: true
        type: boolean
      self_test:
        description: "Diagnostic only — no source changes, no PR"
        required: false
        default: false
        type: boolean
      provider:
        description: "Codex provider: openrouter (default) or openai"
        required: false
        default: "openrouter"
        type: string
      continue_runtime:
        description: "Allow one bounded continuation after this explicit wake"
        required: false
        default: true
        type: boolean
      continuation_depth:
        description: "Bounded continuation depth"
        required: false
        default: "0"
        type: string
  push:
    branches: [main]
  issues:
    types: [opened, labeled, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  # Keep independent refs isolated. GitHub keeps only one running and one
  # pending run per group; the previous static "dispatch" group allowed a
  # dispatch on another branch to replace a still-pending main dispatch.
  group: codex-autonomous-worker-${{ github.ref_name || github.event_name }}
  cancel-in-progress: false

jobs:
  codex:
    if: >
      (github.event_name != 'issues' ||
       contains(join(github.event.issue.labels.*.name, ','), 'codex-task')) &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Invalidate stale task skips on explicit wake
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CODEX_TASK_NUMBER: ${{ inputs.task_number }}
          CODEX_WORKER_MEMORY: ${{ runner.temp }}/codex-worker-memory.json
        run: |
          mkdir -p "$(dirname "$CODEX_WORKER_MEMORY")"
          if [ -f evidence/codex/worker-memory.json ]; then
            cp evidence/codex/worker-memory.json "$CODEX_WORKER_MEMORY"
            node -e 'const fs=require("node:fs"); const path=process.env.CODEX_WORKER_MEMORY; const taskNumber=String(process.env.CODEX_TASK_NUMBER||"").trim(); const memory=JSON.parse(fs.readFileSync(path,"utf8")); const before=Array.isArray(memory.skipped_tasks)?memory.skipped_tasks:[]; if(taskNumber){const target=Number(taskNumber); memory.skipped_tasks=before.filter(item=>Number(item?.number ?? item)!==target);}else{memory.skipped_tasks=[];} memory.updated_at=new Date().toISOString(); fs.writeFileSync(path,`${JSON.stringify(memory,null,2)}\n`); console.log(`EXPLICIT_WAKE stale_skip_invalidated=${before.length-memory.skipped_tasks.length} task=${taskNumber||"all"}`);'
          else
            echo "EXPLICIT_WAKE no workspace memory file; worker artifact continuity remains authoritative."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI (pinned)
        run: npm install --global @openai/codex@0.153.4

      - name: Activate OpenRouter wire budget guard
        run: |
          mkdir -p "$RUNNER_TEMP/codex-bin"
          cp scripts/codex "$RUNNER_TEMP/codex-bin/codex"
          cp scripts/codex-openrouter-budget-proxy.mjs "$RUNNER_TEMP/codex-bin/codex-openrouter-budget-proxy.mjs"
          chmod +x "$RUNNER_TEMP/codex-bin/codex"
          echo "$RUNNER_TEMP/codex-bin" >> "$GITHUB_PATH"
          test -x "$RUNNER_TEMP/codex-bin/codex"
          test -f "$RUNNER_TEMP/codex-bin/codex-openrouter-budget-proxy.mjs"
          node --check "$RUNNER_TEMP/codex-bin/codex-openrouter-budget-proxy.mjs"

      - name: Verify Codex CLI version
        run: |
          codex --version
          test "$(codex --version)" = "codex-cli 0.153.4"

      - name: Restore Codex authentication
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || vars.CODEX_PROVIDER || 'openrouter' }}
        run: |
          mkdir -p "$HOME/.codex"
          REQ="$(printf '%s' "${CODEX_PROVIDER:-}" | tr '[:upper:]' '[:lower:]')"
          echo "provider_requested=${REQ:-empty}"
          case "$REQ" in
            openai|chatgpt|codex)
              if [ -n "$CODEX_AUTH_JSON" ]; then
                printf '%s' "$CODEX_AUTH_JSON" > "$HOME/.codex/auth.json"
                chmod 600 "$HOME/.codex/auth.json"
                echo "auth_present=true auth_mode=chatgpt-codex-session-file"
              else
                echo "auth_present=false auth_mode=openai-auth-missing"
              fi
              ;;
            *)
              echo "auth_present=false auth_mode=openrouter-path-no-session-file"
              ;;
          esac
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "openrouter_key_present=true"
          else
            echo "openrouter_key_present=false"
          fi
          unset CODEX_AUTH_JSON OPENROUTER_API_KEY

      - name: Global breaker gate
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
        run: node .github/swarm/system-breaker.mjs

      - name: Run Codex worker
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || vars.CODEX_PROVIDER || 'openrouter' }}
          CODEX_MODEL: ${{ vars.CODEX_MODEL }}
          CODEX_MAX_OUTPUT_TOKENS: "1024"
          CODEX_OPENROUTER_PROXY_PORT: "17891"
          CODEX_PROXY_DIAGNOSTIC: "1"
          CODEX_WORKER_EVIDENCE: codex-worker-evidence.json
          CODEX_WORKER_MEMORY: ${{ runner.temp }}/codex-worker-memory.json
          CODEX_TASK_LABEL: codex-task
          CODEX_TASK_TIMEOUT_MINUTES: "20"
          CODEX_REPAIR_ATTEMPTS: "3"
          CODEX_MAX_TASKS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_tasks || '12' }}
          CODEX_MAX_RUN_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_minutes || '300' }}
          CODEX_TASK_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.task_number || '' }}
          CODEX_DEBUG: ${{ (github.event_name == 'workflow_dispatch' && inputs.debug == false) && 'false' || 'true' }}
          CODEX_SELF_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.self_test && 'true' || 'false' }}
          CODEX_TRIGGER: ${{ github.event_name }}
          CODEX_HEAD_SHA: ${{ github.sha }}
          CODEX_BEFORE_SHA: ${{ github.event.before || '' }}
          CODEX_ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: node scripts/codex-autonomous-worker.mjs

      - name: Heartbeat summary
        if: always()
        run: |
          if [ -f codex-worker-evidence.json ]; then
            node -e 'const e=require("./codex-worker-evidence.json"); const h=`HEARTBEAT status=${e.status} patch_source=${e.codex?.patch_source||"none"} codex.available=${Boolean(e.codex?.available)} codex.executed=${Boolean(e.codex?.executed)} tasks=${(e.completed_tasks||[]).length} pr=${e.prs?.[0]?.url||"none"}`; console.log(h); console.log(JSON.stringify({status:e.status,codex:e.codex,human:e.human_actions_required,capabilities:e.capabilities||null,autonomy:e.trigger_gate||null},null,2));'
          else
            echo "HEARTBEAT status=FAILED reason=no-evidence-file"
          fi

      - name: Preserve Codex worker evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-worker-${{ github.run_id }}
          path: |
            codex-worker-evidence.json
            ${{ runner.temp }}/codex-worker-memory.json
          if-no-files-found: warn
          retention-days: 30

      - name: Diagnose continuation
        id: cont
        if: always()
        env:
          ACORN_SYSTEM_MODE: ${{ vars.ACORN_SYSTEM_MODE }}
          EVENT_NAME: ${{ github.event_name }}
          CONTINUATION_DEPTH: ${{ inputs.continuation_depth || '0' }}
          CONTINUE_RUNTIME: ${{ github.event_name != 'workflow_dispatch' && 'true' || inputs.continue_runtime }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CODEX_WORKER_EVIDENCE: codex-worker-evidence.json
          RUNTIME_DIAGNOSIS: runtime-diagnosis.json
        run: node scripts/runtime-continue.mjs

      - name: Preserve runtime diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-diagnosis-${{ github.run_id }}
          path: runtime-diagnosis.json
          if-no-files-found: warn
          retention-days: 30

      - name: Continue autonomous runtime
        if: always() && steps.cont.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          NEXT: ${{ steps.cont.outputs.next }}
          NEXT_DEPTH: ${{ steps.cont.outputs.next_depth }}
          SELF_TEST: ${{ steps.cont.outputs.self_test }}
          REASON: ${{ steps.cont.outputs.reason }}
        run: |
          echo "CONTINUITY next=$NEXT depth=$NEXT_DEPTH event=$EVENT_NAME reason=$REASON"
          sleep 15
          if [ "$NEXT" = "SELF_HEAL" ]; then
            gh workflow run self-heal.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "${{ github.ref_name }}" \
              -f reason="$REASON"
            exit 0
          fi
          gh workflow run codex-autonomous-worker.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.ref_name }}" \
            -f max_tasks=12 \
            -f max_minutes=300 \
            -f debug=true \
            -f self_test="$SELF_TEST" \
            -f continue_runtime=true \
            -f continuation_depth="$NEXT_DEPTH"
