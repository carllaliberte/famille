name: ACORN Cortex Knowledge Fabric
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/acorn-cortex-knowledge-fabric.mjs"
      - "test/acorn-cortex-knowledge-fabric.test.js"
      - "docs/acorn-cortex-knowledge-fabric.md"
      - ".github/workflows/acorn-cortex-knowledge-fabric.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/acorn-cortex-knowledge-fabric.test.js
      - run: node -e "import('./scripts/acorn-cortex-knowledge-fabric.mjs').then(m=>{const k=m.validateKnowledge(m.createKnowledge({subject:'x',predicate:'p',value:1,source:'A',evidence:['e']})); const t=m.transferKnowledge({from:'A',to:'B',knowledge:k}); if(m.assertCortexConstitution({breaker_touched:false,authority_transfer:false,hidden_learning:false,auto_merge:false,auto_spend:false,auto_signature:false,live:false,claim_v0:false,transfer:t})!==true) process.exit(1);})"
