name: cognitive-time-machine-verify

on:
  push:
    branches: [main, 'feat/acorn-cognitive-time-machine']
    paths:
      - 'scripts/acorn-cognitive-time-machine.mjs'
      - 'scripts/acorn-cognitive-time-machine-cycle.mjs'
      - 'test/acorn-cognitive-time-machine.test.js'
      - 'package.json'
      - '.github/workflows/cognitive-time-machine-verify.yml'
  pull_request:
    paths:
      - 'scripts/acorn-cognitive-time-machine.mjs'
      - 'scripts/acorn-cognitive-time-machine-cycle.mjs'
      - 'test/acorn-cognitive-time-machine.test.js'
      - 'package.json'
      - '.github/workflows/cognitive-time-machine-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check scripts/acorn-cognitive-time-machine.mjs
          node --check scripts/acorn-cognitive-time-machine-cycle.mjs
      - name: Focused counterfactual tests
        run: node --test test/acorn-cognitive-time-machine.test.js
      - name: Real cognitive time-machine cycle
        run: node scripts/acorn-cognitive-time-machine-cycle.mjs
      - name: Full regression
        run: npm test
