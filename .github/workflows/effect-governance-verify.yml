name: acorn-effect-governance

on:
  push:
    branches: [main, 'grok/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check scripts/acorn-effect-interposition.mjs
          node --check scripts/acorn-effect-governor.mjs
          node --check scripts/codex-interposition-gate.mjs
      - name: Focused effect governance tests
        run: node --test test/acorn-effect-governance.test.js test/codex-interposition-gate.test.js test/codex-worker-interposition.test.js test/cognitive-worker-interposition.test.js
      - name: Coverage audit — hard gate
        run: |
          node --input-type=module <<'NODE'
          import { auditEffectCoverage, assertEffectCoverage } from './scripts/acorn-effect-governor.mjs';
          const audit = auditEffectCoverage();
          console.log(JSON.stringify(audit, null, 2));
          assertEffectCoverage(audit);
          NODE
      - name: Full regression
        run: npm test
