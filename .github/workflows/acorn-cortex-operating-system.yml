name: ACORN Cortex Operating System
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/acorn-cortex-operating-system.mjs"
      - "test/acorn-cortex-operating-system.test.js"
      - "docs/acorn-cortex-operating-system.md"
      - ".github/workflows/acorn-cortex-operating-system.yml"
  schedule:
    - cron: "*/30 * * * *"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node --test test/acorn-cortex-operating-system.test.js
      - run: node -e "import('./scripts/acorn-cortex-operating-system.mjs').then(m=>m.assertCortexConstitution())"
