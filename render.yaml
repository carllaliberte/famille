databases:
  - name: acorn-enterprise-state
    plan: free
    region: ohio
    databaseName: acorn_enterprise_state
    user: acorn_enterprise_state_user

services:
  - type: web
    name: acorn-live
    runtime: docker
    dockerfilePath: ./live/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: acorn-enterprise-state
          property: connectionString
