databases:
  - name: acorn-enterprise-state
    plan: free
    region: ohio
    databaseName: acorn_enterprise_state
    user: acorn_enterprise_state_user
services:
  - type: web
    name: acorn-live
    runtime: docker
    dockerfilePath: ./live/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: acorn-enterprise-state
          property: connectionString
  - type: worker
    name: acorn-live-worker
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm install --ignore-scripts
    startCommand: node live/worker.mjs
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: acorn-enterprise-state
          property: connectionString
      - key: WORKER_POLL_MS
        value: "1000"
